  (function () {
    try {
      var search = new URLSearchParams(location.search);
      var param = search.get('theme');
      var stored = localStorage.getItem('easymarkdown:theme');
      var saved = stored ? JSON.parse(stored) : null;
      var theme = param === 'dark' || param === 'light' ? param
        : saved === 'dark' || saved === 'light' ? saved
        : 'dark';
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  })();

# 开始使用

EasyMarkdown 是一个单文件的 Markdown 编辑器，草稿保存在当前浏览器。

## 快捷键

| 快捷键 | 操作 |
| --- | --- |
| `Ctrl + P` | 命令面板 |
| `Ctrl + S` | 保存草稿 |
| `Ctrl + B` | 加粗 |
| `Ctrl + K` | 插入链接 |
| `Ctrl + F` | 查找 |

- [x] 打开一个文档
- [x] 修改一段文字
- [ ] 切换一次深色主题
- [ ] 导出 HTML

## 示例

```js
function greet(name) {
  return `你好，${name}。`;
}

console.log(greet('EasyMarkdown'));
```

> [!NOTE]
> 分享文章用「导出」→「导出 HTML」；分享编辑器就发这个 HTML 文件。

## 功能

- 文件树、标签页、大纲、命令面板
- 分屏 / 仅编辑 / 仅预览
- 深浅主题、正文字号
- 任务清单、代码高亮、表格、提示块
- Mermaid 流程图 / 时序图 / 甘特图
- 导出 HTML / PDF / Markdown
- 图片粘贴与拖入，正文只保留 `assets/img-xxx.png`

---

<script type="text/markdown" id="demo-thoughts" data-name="产品随想.md">
# 关于写作工具的一点随想

## 一、工具应该退到文字后面

好的写作工具，应该让人忘记工具本身。打开就能写，写完就能走，不要求登录，不提示升级，不把菜单塞满屏幕。

我想要的其实很简单：一张干净的纸，一支顺手的笔。

## 二、为什么是 Markdown

Markdown 的好处不是"简单"，而是**可迁移**。

它只是纯文本。十年后，任何编辑器都还能打开它；换一个平台，格式也不会丢。这种确定性，比任何花哨的功能都重要。

### 纯文本的长期主义

我们保存的不是某个软件的私有格式，而是一份可以一直被读懂的文本。

### 不绑定的自由

写作应该属于写作者，而不是某个账号、某个订阅、某个云服务。

## 三、单文件的可能性

把整个编辑器打包成一个 HTML 文件，是一个有点浪漫的想法：

- 不需要安装，双击就能打开
- 发给别人，对方不用配置任何环境
- 断网也能写
- 你的数据只留在自己的浏览器里

> [!WARNING]
> 单文件也有限制：没有云同步、没有版本历史、超大文档会变慢。它适合轻量写作，不适合作为知识库。

## 四、接下来

先把"打开就能写"这件事做好，再谈其他。

写作的仪式感，应该来自文字本身，而不是工具。

---

*2026 年 11 月，于一个安静的晚上*

# 流程图与图表

Mermaid 代码块会直接渲染成图表。修改代码，右侧会重新绘制。

## 流程图

```mermaid
flowchart LR
  A[打开文档] --> B{需要预览?}
  B -->|是| C[分屏模式]
  B -->|否| D[仅编辑]
  C --> E[导出 HTML]
  D --> E
```

## 时序图

```mermaid
sequenceDiagram
  participant U as 用户
  participant E as EasyMarkdown
  participant B as 浏览器
  U->>E: 输入 Markdown
  E->>B: 实时渲染
  B-->>U: 更新预览
```

## 甘特图

```mermaid
gantt
  title 文档撰写计划
  dateFormat YYYY-MM-DD
  section 初稿
  收集资料 :a1, 2026-11-01, 3d
  撰写正文 :a2, after a1, 5d
  section 修订
  校对 :a3, after a2, 2d
```

> [!TIP]
> 点击工具栏的流程图按钮，可以插入一个 Mermaid 模板。

<script type="text/markdown" id="demo-design" data-name="设计规范.md">
# EasyMarkdown · 设计规范

## 色彩

| 名称 | 色值 | 用途 |
| --- | --- | --- |
| 背景 | `#050A12` | 工作区 |
| 面板 | `#0A1420` | 编辑器 / 文档卡 |
| 正文 | `#F2F7F5` | 主文字 |
| 霓虹绿 | `#3EF07C` | 交互与强调 |
| 边框 | `rgba(120,255,170,.10)` | 分隔线 |

## 字体

- 界面：Inter / 微软雅黑
- 正文：系统无衬线字体
- 代码：Cascadia Code / Consolas

## 间距

4px 网格。正文行高 **1.75**，段落间距 **12px**，阅读宽度 **760px**。控件圆角 **10px**，文档卡圆角 **16px**。

## 动效

- 悬停 / 按下：140ms
- 菜单 / 弹层：180ms
- 统一缓动：`cubic-bezier(0.22, 1, 0.36, 1)`

```css
:root {
  --bg: #050a12;
  --surface: #0a1420;
  --text: #f2f7f5;
  --accent: #3ef07c;
}
```
